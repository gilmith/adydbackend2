server:
  port: ${SERVER_PORT:10000}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  ai:
    mcp:
      server:
        name: adydback
        version: 1.0.0
        # Opencode usa Streamable HTTP -> URL http://<host>:10000/api/mcp
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        # SSE legacy (deprecado en Spring AI 2.x). Solo si se activa protocol: SSE
        # sse-endpoint: /sse
        # sse-message-endpoint: /mcp/message

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      idle-timeout: 60000
      driver-class-name: org.postgresql.Driver
      # TODO(docker): jdbc-url, username y password se definen en
      # application-local.yaml / application-docker.yaml

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  security:
    oauth2:
      # TODO(docker): issuer-uri y jwk-set-uri se definen en los perfiles.
      # El issuer debe coincidir con el claim 'iss' del token y el jwk-set-uri
      # debe ser alcanzable desde el contenedor.
      client:
        registration:
          # Registro OAuth2 que usa el MCP para pedir el token (client_credentials).
          # El client-id real en Keycloak es mcp-server.
          mcp-server:
            provider: keycloak
            client-id: ${MCP_CLIENT_ID:mcp-server}
            # TODO(docker): externalizar el secreto en la variable MCP_CLIENT_SECRET
            client-secret: ${MCP_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic

s3:
  # TODO(docker): credenciales y endpoints se definen en los perfiles
  key: ${AWS_ACCESS_KEY_ID:}
  secret: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

casbin:
  enable-casbin: true
  initialize-schema: create
  model: classpath:casbin/model.conf
  store-type: jdbc

openapi:
  spec:
    path: ${OPENAPI_SPEC_PATH:/openapi.yaml}
  # TODO(docker): reutiliza api.base.url; se puede sobrescribir con OPENAPI_URL
  url: ${OPENAPI_URL:${api.base.url}}

api:
  base:
    # TODO(docker): se define en application-local.yaml / application-docker.yaml
    url: ${API_BASE_URL:}
  version: ${API_VERSION:2.0}
