name: Publish to GitHub Packages and Releases

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa al hacer push de tags como v1.0.0, v2.1.3, etc.
      - '*.*.*'   # O formatos como 1.0.0
  workflow_dispatch: # Permite ejecución manual desde la web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Necesario para subir archivos a Releases
      packages: write   # Necesario para subir artefactos a GitHub Packages

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Extraer la versión limpia desde el Tag (ej: v1.0.0 -> 1.0.0)
      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      # 2. Configurar Java 21 y credenciales de GitHub Packages para Maven
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github # Identificador que usará Maven para autenticarse
          settings-path: ${{ github.workspace }} # Genera un settings.xml temporal

      # 3. Ajustar dinámicamente la versión en el pom.xml con la versión del Tag
      - name: Update POM Version
        run: |
          mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }} -DgenerateBackupPoms=false

      # 4. Compilar, empaquetar y publicar en GitHub Packages (Artifactory)
      - name: Build and Deploy to GitHub Packages
        run: mvn clean deploy -DskipTests=false --settings ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automático proporcionado por GitHub

      # 5. Adjuntar el .jar compilado directamente en la Release de GitHub
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/*.jar
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Artefacto publicado exitosamente en GitHub Packages con versión `${{ steps.get_version.outputs.VERSION }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
