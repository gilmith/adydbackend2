name: Publish to GitHub Packages and Releases

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa al hacer push de tags
      - '*.*.*'
  workflow_dispatch:
    # Añadimos un input para cuando lo ejecutas a mano desde la web
    inputs:
      manual_version:
        description: 'Versión a publicar (ej: 1.0.1)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Lógica condicional: Si viene de un Tag lo usa; si es manual, usa el input de la web
      - name: Resolve Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Si se lanzó a mano, usamos lo que escribiste en la web (quitándole la 'v' si la pusiste)
            VERSION="${{ inputs.manual_version }}"
            VERSION="${VERSION#v}"
          else
            # Si se lanzó por push de Tag, usamos el nombre del Tag
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      # 2. Configurar JDK 25 y credenciales
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      # 3. Ajustar versión dinámicamente
      - name: Update POM Version
        run: mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }} -DgenerateBackupPoms=false

      # 4. Compilar, empaquetar y subir a GitHub Packages
      - name: Build and Deploy to GitHub Packages
        run: mvn clean deploy -DskipTests=false --settings ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Adjuntar el .jar a la Release
      # Quitamos el IF restrictivo para que también genere la release al lanzarlo manual
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "Release v${{ steps.get_version.outputs.VERSION }}"
          body: |
            Artefacto publicado exitosamente en GitHub Packages con versión `${{ steps.get_version.outputs.VERSION }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
