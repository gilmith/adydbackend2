name: Publish to GitHub Packages and Releases

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa al hacer push de tags como v1.0.0, v2.1.3, etc.
      - '*.*.*'    # O formatos como 1.0.0
  workflow_dispatch: # Permite ejecución manual desde la web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Necesario para subir a Releases y hacer push a main
      packages: write   # Necesario para subir artefactos a GitHub Packages

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarga todo el historial de ramas y tags
          persist-credentials: true # Mantiene el token de autenticación para los comandos git posteriores

      # 1. Extraer la versión limpia desde el Tag (ej: v1.0.0 -> 1.0.0)
      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      # 2. Configurar Java 25 y credenciales de GitHub Packages para Maven
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github # Identificador que usará Maven para autenticarse
          settings-path: ${{ github.workspace }} # Genera un settings.xml temporal

      # 3. Ajustar dinámicamente la versión en el pom.xml con la versión del Tag
      - name: Update POM Version
        run: |
          mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }} -DgenerateBackupPoms=false

      # 4. Compilar, empaquetar y publicar en GitHub Packages
      - name: Build and Deploy to GitHub Packages
        run: mvn clean deploy -DskipTests=false --settings ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Empaquetar el cliente Angular generado en el build
      - name: Package Angular Client
        run: |
          tar -czf client-angular-${{ steps.get_version.outputs.VERSION }}.tar.gz -C target/generated-clients/angular .

      # 6. Adjuntar el .jar compilado y el cliente Angular en la Release de GitHub
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/*.jar
            client-angular-${{ steps.get_version.outputs.VERSION }}.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Artefacto publicado exitosamente en GitHub Packages con versión `${{ steps.get_version.outputs.VERSION }}`.
            - Cliente Java publicado en GitHub Packages
            - Cliente Angular (typescript-angular, ng 22) adjunto como `client-angular-${{ steps.get_version.outputs.VERSION }}.tar.gz`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Merge automático del commit del tag a la rama main
      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout .
          git fetch origin main:main
          git checkout main
          git merge ${{ github.sha }} --no-ff -m "chore(release): merge tag ${{ github.ref_name }} into main"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}